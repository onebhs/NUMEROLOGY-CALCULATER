<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numerology Calculator with Lo Shu Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        .grid-cell {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background-color: #fff;
            transition: all 0.3s ease;
            position: relative;
        }
        .active-cell {
            background-color: #eef2ff;
            border-color: #6366f1;
            color: #4338ca;
            box-shadow: inset 0 0 10px rgba(99, 102, 241, 0.1);
        }
        .lucky-badge {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 10px;
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto glass-card p-6 md:p-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-800">Numerology Calculator</h1>
            <p class="text-gray-600 mt-2">Lo Shu Grid & Age Calculator</p>
        </div>

        <!-- Input Section -->
        <div class="space-y-6">
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
                    <select id="dobDay" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <script>
                            for(let i=1; i<=31; i++) document.write(`<option value="${i}">${i}</option>`);
                        </script>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Month</label>
                    <select id="dobMonth" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="1">Jan (1)</option>
                        <option value="2">Feb (2)</option>
                        <option value="3">Mar (3)</option>
                        <option value="4">Apr (4)</option>
                        <option value="5">May (5)</option>
                        <option value="6">Jun (6)</option>
                        <option value="7">Jul (7)</option>
                        <option value="8">Aug (8)</option>
                        <option value="9">Sep (9)</option>
                        <option value="10">Oct (10)</option>
                        <option value="11">Nov (11)</option>
                        <option value="12">Dec (12)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Year</label>
                    <input type="number" id="dobYear" placeholder="YYYY" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" value="1990">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <label class="flex flex-col items-center p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:bg-indigo-50 transition-colors has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                    <input type="radio" name="gender" value="male" class="hidden" checked>
                    <span class="text-lg font-medium text-gray-700">Male</span>
                </label>
                <label class="flex flex-col items-center p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:bg-pink-50 transition-colors has-[:checked]:border-pink-500 has-[:checked]:bg-pink-50">
                    <input type="radio" name="gender" value="female" class="hidden">
                    <span class="text-lg font-medium text-gray-700">Female</span>
                </label>
            </div>

            <button onclick="calculateNumerology()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                Calculate All Numbers
            </button>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden mt-10 space-y-8">
            <!-- Age Result -->
            <div class="bg-indigo-900 text-white p-5 rounded-2xl shadow-md text-center">
                <p class="text-xs uppercase font-bold text-indigo-300 mb-1">Current Age</p>
                <p id="ageResult" class="text-2xl font-bold">0 Years, 0 Months, 0 Days</p>
            </div>

            <div>
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 text-center mb-4">Numerology Report</h2>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center">
                        <p class="text-[10px] uppercase font-bold text-blue-600">Driver (Mulank)</p>
                        <p id="driverResult" class="text-3xl font-black text-blue-900">0</p>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 text-center">
                        <p class="text-[10px] uppercase font-bold text-purple-600">Conductor (Bhagyank)</p>
                        <p id="conductorResult" class="text-3xl font-black text-purple-900">0</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-xl border border-green-100 text-center">
                        <p class="text-[10px] uppercase font-bold text-green-600">Kua Number (Lucky)</p>
                        <p id="kuaResult" class="text-3xl font-black text-green-900">0</p>
                    </div>
                    <div class="bg-orange-50 p-4 rounded-xl border border-orange-100 text-center">
                        <p class="text-[10px] uppercase font-bold text-orange-600" id="pyYearLabel">Personal Year</p>
                        <p id="personalYearResult" class="text-3xl font-black text-orange-900">0</p>
                    </div>
                    <div class="bg-teal-50 p-4 rounded-xl border border-teal-100 text-center">
                        <p class="text-[10px] uppercase font-bold text-teal-600">Personal Month</p>
                        <p id="personalMonthResult" class="text-3xl font-black text-teal-900">0</p>
                    </div>
                    <div class="bg-rose-50 p-4 rounded-xl border border-rose-100 text-center">
                        <p class="text-[10px] uppercase font-bold text-rose-600">Personal Day</p>
                        <p id="personalDayResult" class="text-3xl font-black text-rose-900">0</p>
                    </div>
                </div>
                <p class="text-center text-[11px] text-gray-500 font-medium bg-white p-2 mt-4 rounded shadow-sm">
                    Aaj ki Tarikh: <span id="currentDateDisplay"></span>
                </p>
            </div>

            <!-- Lo Shu Grid Section -->
            <div>
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 text-center mb-6">Lo Shu Grid Chart</h2>
                <div class="max-w-[300px] mx-auto grid grid-cols-3 gap-2 bg-gray-100 p-2 rounded-2xl shadow-inner">
                    <div id="cell-4" class="grid-cell"></div>
                    <div id="cell-9" class="grid-cell"></div>
                    <div id="cell-2" class="grid-cell"></div>
                    <div id="cell-3" class="grid-cell"></div>
                    <div id="cell-5" class="grid-cell"></div>
                    <div id="cell-7" class="grid-cell"></div>
                    <div id="cell-8" class="grid-cell"></div>
                    <div id="cell-1" class="grid-cell"></div>
                    <div id="cell-6" class="grid-cell"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getSingleDigit(num) {
            if (num === 0) return 0;
            while (num > 9) {
                let sum = 0;
                let s = num.toString();
                for (let i = 0; i < s.length; i++) {
                    sum += parseInt(s[i]);
                }
                num = sum;
            }
            return num;
        }

        const dayToNumberMap = {
            0: 1, // Sunday
            1: 2, // Monday
            2: 9, // Tuesday
            3: 5, // Wednesday
            4: 3, // Thursday
            5: 6, // Friday
            6: 8  // Saturday
        };

        function calculateNumerology() {
            const day = parseInt(document.getElementById('dobDay').value);
            const month = parseInt(document.getElementById('dobMonth').value) - 1; // JS months are 0-11
            const yearStr = document.getElementById('dobYear').value;
            
            if (!yearStr || yearStr.length < 4) {
                alert("Please enter a valid Year");
                return;
            }

            const year = parseInt(yearStr);
            const gender = document.querySelector('input[name="gender"]:checked').value;
            
            const today = new Date();
            const dob = new Date(year, month, day);

            // Age Calculation
            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('ageResult').innerText = `${years} Years, ${months} Months, ${days} Days`;

            // Numerology variables
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;
            const currentDayIndex = today.getDay();

            document.getElementById('currentDateDisplay').innerText = today.toDateString();

            let effectiveYear = currentYear;
            if (currentMonth < 2) effectiveYear = currentYear - 1;

            const driver = getSingleDigit(day);
            const conductor = getSingleDigit(day + (month + 1) + year);

            let kuaYear = ((month + 1) < 2) ? year - 1 : year;
            let yearSum = getSingleDigit(kuaYear);
            let kua = (gender === 'male') ? getSingleDigit(11 - yearSum) : getSingleDigit(4 + yearSum);

            const personalYear = getSingleDigit(day + (month + 1) + effectiveYear);
            const personalMonth = getSingleDigit(personalYear + currentMonth);
            const dayNumber = dayToNumberMap[currentDayIndex];
            const personalDay = getSingleDigit(personalYear + personalMonth + dayNumber);

            document.getElementById('results').classList.remove('hidden');
            document.getElementById('driverResult').innerText = driver;
            document.getElementById('conductorResult').innerText = conductor;
            document.getElementById('kuaResult').innerText = kua;
            document.getElementById('personalYearResult').innerText = personalYear;
            document.getElementById('personalMonthResult').innerText = personalMonth;
            document.getElementById('personalDayResult').innerText = personalDay;
            document.getElementById('pyYearLabel').innerText = `Personal Year (${effectiveYear})`;

            generateGrid(day, (month + 1), year, driver, conductor, kua);
        }

        function generateGrid(d, m, y, driver, conductor, kua) {
            for(let i=1; i<=9; i++) {
                const cell = document.getElementById(`cell-${i}`);
                cell.innerHTML = "";
                cell.classList.remove('active-cell');
            }

            let allNumbers = (d.toString() + m.toString() + y.toString() + driver.toString() + conductor.toString() + kua.toString()).split("");
            
            let countMap = {};
            allNumbers.forEach(numStr => {
                let n = parseInt(numStr);
                if (n > 0) countMap[n] = (countMap[n] || 0) + 1;
            });

            for (let num in countMap) {
                const cell = document.getElementById(`cell-${num}`);
                if (cell) {
                    let displayStr = "";
                    for(let i=0; i < countMap[num]; i++) {
                        displayStr += num;
                        if(i < countMap[num]-1 && countMap[num] > 2) displayStr += "\n"; 
                    }
                    cell.innerText = displayStr;
                    cell.classList.add('active-cell');
                    
                    if (parseInt(num) === kua) {
                        const badge = document.createElement('span');
                        badge.className = 'lucky-badge';
                        badge.innerText = '★';
                        cell.appendChild(badge);
                    }

                    cell.style.fontSize = countMap[num] > 2 ? '0.9rem' : '1.5rem';
                    cell.style.whiteSpace = 'pre-line';
                }
            }
        }
    </script>
</body>
</html>
